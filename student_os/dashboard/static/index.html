<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="token" content="{{TOKEN}}">
<title>Study desk</title>
<style>
:root{
  --bg:#f6f7f5;--panel:#fff;--text:#1f2933;--muted:#6b7280;--line:#e5e7eb;
  --accent:#136f63;--accent-soft:#e8f3f0;--warn:#a36518;--warn-soft:#f7efe3;
  --danger:#a8453c;--danger-soft:#f7e8e6;--radius:12px;
  --sans:"Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;
  --serif:Charter,"Iowan Old Style",Georgia,serif;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#12181d;--panel:#192127;--text:#e6ece9;--muted:#9ba8b0;--line:#2a343c;
    --accent:#58c7b5;--accent-soft:#173a35;--warn:#e0a14c;--warn-soft:#3a2c17;
    --danger:#e37d72;--danger-soft:#3b2422;color-scheme:dark}
}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}.frame{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh}
.brand{font-size:18px;font-weight:650;margin:0 0 28px 10px}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:2px}
.nav{list-style:none;margin:0;padding:0;display:grid;gap:5px}.nav a{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:9px;text-decoration:none;font-weight:550}
.nav a:hover{background:var(--panel)}.nav a[aria-current="page"]{background:var(--accent-soft)}
.nav .count{font-size:12px;color:var(--muted);font-weight:600}.nav .fresh{color:var(--accent)}
.side-note{font-size:12px;color:var(--muted);margin:28px 12px 0}
.main{padding:34px clamp(18px,5vw,64px) 70px;max-width:1220px;width:100%}
.view{max-width:980px}h1{font-size:30px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}h2{font-size:16px;margin:0 0 12px}
.sub{margin:0 0 30px;color:var(--muted)}.muted{color:var(--muted)}.empty{color:var(--muted);font-family:var(--serif);font-size:16px;padding:14px 0}
.section-block{margin:0 0 34px}.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.section-title a{font-size:13px;color:var(--accent);text-decoration:none}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);text-decoration:none}
.item:last-child{border-bottom:0}.item:hover{background:var(--accent-soft)}.item-title{font-weight:600}.meta{font-size:13px;color:var(--muted);margin-top:2px}
.badge{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}.badge.updated{color:var(--warn)}.badge.due{color:var(--danger)}
.primary-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.primary-card h3{font-size:16px;margin:0 0 4px}.primary-card p{margin:0;color:var(--muted)}
.attention{display:grid;gap:10px}.attention a{text-decoration:none}.attention .primary-card:hover{border-color:var(--accent)}
.modules-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.module-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-decoration:none}
.module-card:hover{border-color:var(--accent)}.module-card h3{margin:0 0 4px;font-size:16px}.module-card .code{font-size:12px;color:var(--muted);margin-bottom:12px}
.module-card .stats{font-size:13px;color:var(--muted)}.module-card .new{color:var(--accent);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 28px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:9px;text-decoration:none;font-weight:600}
.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn[disabled]{opacity:.5;cursor:progress}
.crumbs{font-size:13px;color:var(--muted);margin:0 0 8px}.crumbs a{color:var(--muted)}
.module-section{margin:0 0 28px}.module-section h2{padding-bottom:7px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.module-section h2 span{font-weight:400;color:var(--muted);font-size:12px}
.file-row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--line);text-decoration:none}
.file-row:hover{background:var(--panel)}.kind{font-size:10px;font-weight:700;text-transform:uppercase;text-align:center;padding:3px 4px;border-radius:5px;background:var(--line);color:var(--muted)}
.kind.pdf{background:var(--danger-soft);color:var(--danger)}.kind.pptx,.kind.ppt{background:var(--warn-soft);color:var(--warn)}.kind.docx,.kind.doc{background:var(--accent-soft);color:var(--accent)}
.file-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:40px;align-items:start}
.toc{list-style:none;margin:0;padding:0}.toc li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;border-bottom:1px solid var(--line)}
.toc a,.toc .t{padding:7px 0;text-decoration:none}.toc .p{padding:7px 0;color:var(--muted);font-size:12px}
.date-item{padding:10px 0;border-bottom:1px solid var(--line)}.date-item.past{opacity:.5}.date-item .when{font-weight:650}.date-item .quote{font-family:var(--serif);font-size:14px;margin-top:3px}
.notes{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:0 0 30px}.notes .summary{font-family:var(--serif);font-size:17px;max-width:64ch}.notes ul{font-family:var(--serif);padding-left:20px}.notes .byline,.help{font-size:13px;color:var(--muted)}
.notes textarea{width:100%;min-height:150px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px;margin:10px 0}
.warn{color:var(--warn)}.row-actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:12px}
.search-box{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 14px;max-width:720px}
.search-box input{flex:1;border:0;background:transparent;padding:12px 0;outline:none;font-size:16px}
.hit{display:block;padding:13px 10px;border-bottom:1px solid var(--line);text-decoration:none}.hit:hover{background:var(--panel)}.hit .title{font-weight:650}.hit .where{font-size:13px;color:var(--muted)}.hit .snip{font-family:var(--serif);margin-top:4px}
mark{background:#f7dfa0;color:inherit}.deck{max-width:680px}.progress{font-size:13px;color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--radius);padding:26px;min-height:220px}
.card .from{font-size:13px;color:var(--muted)}.card .q{font-family:var(--serif);font-size:22px}.card .a{font-family:var(--serif);font-size:18px;border-top:1px dashed var(--line);padding-top:16px;margin-top:18px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.grades .btn{flex-direction:column}.grades small{font-weight:400;color:var(--muted);font-size:11px}
.keys{font-size:12px;color:var(--muted)}.totals{margin-top:28px;max-width:680px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 15px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.tool-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}.tool-card h2{margin-bottom:8px}.tool-card p{margin:0 0 12px;color:var(--muted)}
@media(max-width:760px){
  .frame{display:block;padding-bottom:72px}.side{position:fixed;z-index:20;left:0;right:0;bottom:0;top:auto;height:auto;background:var(--panel);border:0;border-top:1px solid var(--line);padding:7px 8px}
  .brand,.side-note{display:none}.nav{grid-template-columns:repeat(4,1fr);gap:2px}.nav a{display:block;text-align:center;padding:8px 4px;font-size:12px}.nav .count{display:block;font-size:10px;margin-top:1px}
  .main{padding:22px 16px 36px}.modules-grid,.more-grid,.file-grid{grid-template-columns:1fr}.grades{grid-template-columns:repeat(2,1fr)}h1{font-size:26px}
}
</style>
</head>
<body>
<div class="frame">
  <aside class="side">
    <p class="brand">Study desk<small>Your university, organised</small></p>
    <ul class="nav" id="nav"></ul>
    <p class="side-note">Home is your inbox. Modules hold everything. Revision shows what is due.</p>
  </aside>
  <main class="main"><div class="view" id="view" aria-live="polite"></div></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const TOKEN=document.querySelector('meta[name="token"]').content;
const view=document.getElementById("view"),nav=document.getElementById("nav");let overview=null;
const api=async(path,options={})=>{const r=await fetch(path,{...options,headers:{...(options.headers||{}),"X-Token":TOKEN}});if(!r.ok)throw new Error((await r.json()).error||r.statusText);return r.json()};
const fileUrl=(id,page)=>`/files/${id}?t=${encodeURIComponent(TOKEN)}${page?`#page=${page}`:""}`;
function h(tag,attrs={},...children){const el=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(v===null||v===undefined||v===false)continue;if(k==="class")el.className=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);else el.setAttribute(k,v===true?"":v)}for(const c of children.flat(Infinity)){if(c===null||c===undefined||c===false)continue;el.append(c instanceof Node?c:document.createTextNode(String(c)))}return el}
const show=(...c)=>view.replaceChildren(...c.flat(Infinity).filter(Boolean));
const toast=m=>{const e=document.getElementById("toast");e.textContent=m;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2200)};
const parseDay=iso=>new Date(iso+"T12:00:00"),fmt=(d,o)=>d.toLocaleDateString("en-GB",o);
const daysAway=(iso,today)=>{const n=Math.round((parseDay(iso)-parseDay(today))/86400000);return n===0?"Today":n===1?"Tomorrow":`In ${n} days`};
const kindTag=kind=>h("span",{class:`kind ${kind}`},kind==="link"?"link":kind==="video"?"video":kind);
const highlighted=text=>{const span=h("span");let mark=false;for(const p of String(text).split(/(\[\[|\]\])/)){if(p==="[["){mark=true;continue}if(p==="]]"){mark=false;continue}if(p)span.append(mark?h("mark",{},p):document.createTextNode(p))}return span};

function renderNav(current){
  const due=overview?.cards_due||0;
  nav.replaceChildren(
    h("li",{},h("a",{href:"#/","aria-current":current==="home"?"page":null},"Home")),
    h("li",{},h("a",{href:"#/modules","aria-current":current==="modules"?"page":null},"Modules")),
    h("li",{},h("a",{href:"#/revise","aria-current":current==="revise"?"page":null},
      h("span",{},"Revision"),h("span",{class:`count ${due?"fresh":""}`},due?`${due} due`:""))),
    h("li",{},h("a",{href:"#/more","aria-current":current==="more"?"page":null},"More"))
  );
}

function greeting(){const n=new Date().getHours();return n<12?"Good morning":n<18?"Good afternoon":"Good evening"}

function renderHome(){
  const {today,coming_up,feed,cards_due}=overview;
  const attention=[];
  if(cards_due)attention.push(h("a",{href:"#/revise"},h("div",{class:"primary-card"},
    h("h3",{},`${cards_due} flashcard${cards_due===1?"":"s"} due`),h("p",{},"A short review now will keep them spaced out."))));
  for(const item of coming_up.slice(0,3))attention.push(h("a",{href:`#/file/${item.resource_id}`},h("div",{class:"primary-card"},
    h("h3",{},item.kind==="exam"?`Exam — ${item.title}`:item.title),
    h("p",{},`${daysAway(item.date,today)} · ${item.module} · ${fmt(parseDay(item.date),{day:"numeric",month:"short"})}`))));
  const fresh=feed.filter(x=>x.event!=="removed").slice(0,6);
  show(
    h("h1",{},greeting()),
    h("p",{class:"sub"},fmt(parseDay(today),{weekday:"long",day:"numeric",month:"long"})),
    h("section",{class:"section-block"},
      h("div",{class:"section-title"},h("h2",{},"Needs attention"),coming_up.length>3?h("a",{href:"#/more"},"See all"):null),
      h("div",{class:"attention"},attention.length?attention:h("p",{class:"empty"},"Nothing urgent. You're clear for now."))),
    h("section",{class:"section-block"},
      h("div",{class:"section-title"},h("h2",{},"New"),fresh.length?h("span",{class:"muted"},`${fresh.length} recent`):null),
      fresh.length?h("div",{class:"list"},fresh.map(feedRow)):h("p",{class:"empty"},"Nothing new from Moodle in the last two weeks.")))
}
function feedRow(event){return h("a",{class:"item",href:`#/file/${event.resource_id}`},
  h("div",{},h("div",{class:"item-title"},event.title),h("div",{class:"meta"},`${event.module}${event.section?", "+event.section:""}`)),
  h("span",{class:`badge ${event.event}`},event.event==="updated"?"Updated":"New"))}

function renderModules(){
  const modules=overview.modules||[];
  show(h("h1",{},"Modules"),h("p",{class:"sub"},"Everything from Moodle, organised by module."),
    modules.length?h("div",{class:"modules-grid"},modules.map(m=>h("a",{class:"module-card",href:`#/module/${m.id}`},
      h("h3",{},m.name),m.code?h("div",{class:"code"},m.code):null,
      h("div",{class:"stats"},`${m.files} file${m.files===1?"":"s"}`,m.recent?h("span",{class:"new"},` · ${m.recent} new`):""))))
      :h("p",{class:"empty"},"No modules yet. Run a Moodle sync first."))
}

async function renderModule(id){
  const module = await api(`/api/module/${id}`);

  const sections = module.sections.length
    ? module.sections.map(section => {
        const rows = section.items.map(item => {
          const isLink = item.kind === "link" || item.kind === "video";
          const attrs = isLink
            ? { class: "file-row", href: item.moodle_url, target: "_blank", rel: "noopener" }
            : { class: "file-row", href: `#/file/${item.id}` };

          let detail = "";
          if (item.pages) {
            const units = item.kind === "pptx" ? "slides" : item.kind === "docx" ? "sections" : "pages";
            detail = `${item.pages} ${units}`;
          } else if (isLink) {
            detail = item.type === "assign" ? "Assignment on Moodle" : "On Moodle";
          }

          return h("a", attrs,
            kindTag(item.kind),
            h("div", {},
              h("div", { class: "item-title" }, item.title),
              detail ? h("div", { class: "meta" }, detail) : null
            ),
            h("span", { class: `badge ${item.badge || ""}` },
              item.badge === "new" ? "New" : item.badge === "updated" ? "Updated" : ""
            )
          );
        });

        return h("section", { class: "module-section" },
          h("h2", {},
            section.name,
            h("span", {}, `${section.items.length} item${section.items.length === 1 ? "" : "s"}`)
          ),
          rows
        );
      })
    : h("p", { class: "empty" }, "No files from this module yet.");

  show(
    h("p", { class: "crumbs" }, h("a", { href: "#/modules" }, "Modules"), " / ", module.name),
    h("h1", {}, module.name),
    h("p", { class: "sub" },
      module.code ? `${module.code}. ` : "",
      h("a", { href: module.url, target: "_blank", rel: "noopener" }, "Open on Moodle")
    ),
    sections
  );
}

async function renderFile(id){
  const file=await api(`/api/resource/${id}`),isPdf=file.kind==="pdf";
  const openFile=async page=>{if(isPdf){window.open(fileUrl(file.id,page),"_blank","noopener");return}await api(`/api/open/${file.id}`,{method:"POST"});toast(page?`Opened — go to ${page}`:"Opened")};
  const unit=file.kind==="pptx"?"Slide":file.kind==="docx"?"Section":"Page";
  const outline=file.outline.length?h("ol",{class:"toc"},file.outline.map(e=>h("li",{},
    file.has_file?h("a",{href:"#",onclick:x=>{x.preventDefault();openFile(e.page)}},e.title):h("span",{class:"t"},e.title),
    h("span",{class:"p"},`${unit} ${e.page}`)))):h("p",{class:"empty"},"No outline for this file.");
  const dates=file.dates.length?file.dates.map(d=>h("div",{class:`date-item ${d.upcoming?"":"past"}`},
    h("div",{},h("span",{class:"when"},fmt(parseDay(d.date),{day:"numeric",month:"short",year:"numeric"})),
      d.kind!=="date"?h("span",{class:`badge ${d.kind==="exam"?"due":"updated"}`,style:"margin-left:8px"},d.kind==="exam"?"Exam":"Deadline"):null),
    h("div",{class:"quote"},d.snippet))):h("p",{class:"empty"},"No dates mentioned in this file.");
  show(h("p",{class:"crumbs"},h("a",{href:`#/module/${file.module_id}`},file.module),file.section?` / ${file.section}`:""),
    h("h1",{},file.title),h("p",{class:"sub"},[file.pages?`${file.pages} ${unit.toLowerCase()}s`:null,file.words?`${file.words.toLocaleString("en-GB")} words`:null].filter(Boolean).join(" · ")),
    h("div",{class:"actions"},file.has_file?h("button",{class:"btn primary",onclick:()=>openFile()},isPdf?"Read":"Open"):null,
      h("a",{class:"btn",href:file.moodle_url,target:"_blank",rel:"noopener"},"Open on Moodle")),
    notesPanel(file),
    h("div",{class:"file-grid"},
      h("section",{},h("h2",{},"Outline"),outline),
      h("section",{},h("h2",{},"Dates"),dates,
        file.versions.length?h("div",{style:"margin-top:24px"},h("h2",{},"Earlier versions"),
          file.versions.map(v=>h("p",{class:"muted"},`Replaced ${new Date(v.at).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}`))):null)))
}

function notesPanel(file){
  const panel=h("section",{class:"notes","aria-live":"polite"}),n=file.notes;if(!file.readable&&!n)return null;
  if(n){panel.append(h("h2",{},"Study notes"),n.outdated?h("p",{class:"warn"},"This file has changed since these notes were made."):null,
    n.summary?h("p",{class:"summary"},n.summary):null,n.key_points.length?h("ul",{},n.key_points.map(x=>h("li",{},x))):null,
    h("p",{class:"byline"},n.source==="claude"?"Made with Claude":"Made locally on this Mac"),
    h("div",{class:"row-actions"},n.flashcards.length?h("a",{class:"btn primary",href:`#/revise?file=${file.id}`},`Revise ${n.flashcards.length} cards`):null,makeButtons(file,panel,true)));
  }else{panel.append(h("h2",{},"Study notes"),h("p",{class:"help"},"Create a short summary, key points and flashcards."),h("div",{class:"row-actions"},makeButtons(file,panel,false)))}
  return panel
}
function makeButtons(file,panel,again){
  const wrap=h("span",{class:"row-actions",style:"margin:0"}),local=h("button",{class:again?"btn":"btn primary",onclick:()=>summariseHere(file,panel,local)},again?"Remake locally":"Make notes locally"),
    claude=h("button",{class:"btn",onclick:()=>copyForClaude(file,panel)},"Copy for Claude");wrap.append(local,claude);return wrap
}
async function summariseHere(file,panel,button){
  const ai=await api("/api/ai");if(!ai.running||!ai.model){toast("Open Ollama and install gemma3:4b, or use Claude");return}
  button.disabled=true;button.textContent="Making notes…";try{file.notes=await api(`/api/notes/${file.id}/ollama`,{method:"POST"});panel.replaceWith(notesPanel(file));await refreshOverview()}catch(e){button.disabled=false;button.textContent="Try again";toast(e.message)}
}
async function copyForClaude(file,panel){
  let prompt;try{prompt=(await api(`/api/claude-prompt/${file.id}`)).prompt;await navigator.clipboard.writeText(prompt);toast("Copied for Claude")}catch(e){toast(e.message);return}
  panel.querySelector(".paste")?.remove();const box=h("textarea",{placeholder:"Paste Claude's whole reply here"}),save=h("button",{class:"btn primary",onclick:async()=>{save.disabled=true;try{file.notes=await api(`/api/notes/${file.id}/claude`,{method:"POST",body:JSON.stringify({reply:box.value})});panel.replaceWith(notesPanel(file));await refreshOverview();toast("Notes saved")}catch(e){save.disabled=false;toast(e.message)}}},"Save notes");
  panel.append(h("div",{class:"paste"},h("p",{class:"help"},"Paste the copied prompt into Claude, then paste Claude's reply below."),box,save));box.focus()
}

async function renderRevise(fileId){
  const data = await api("/api/cards");
  let queue = data.cards.filter(card => !fileId || String(card.resource_id) === fileId);
  const total = queue.length;
  let done = 0;

  const deck = h("div", { class: "deck" });
  const totals = h("section", { class: "totals" });

  if (data.totals.length) {
    totals.append(
      h("h2", {}, "By module"),
      ...data.totals.map(t =>
        h("div", { class: "item" },
          h("div", {},
            h("div", { class: "item-title" }, t.module),
            h("div", { class: "meta" }, `${t.learned} of ${t.total} learned`)
          ),
          h("span", { class: `badge ${t.due ? "due" : ""}` }, t.due ? `${t.due} due` : "Up to date")
        )
      )
    );
  }

  show(
    h("h1", {}, "Revision"),
    h("p", { class: "sub" },
      fileId && queue[0] ? `Flashcards from ${queue[0].title}` : "Cards due for active recall today."
    ),
    deck,
    totals
  );

  const next = () => {
    document.onkeydown = null;

    if (!queue.length) {
      deck.replaceChildren(
        h("p", { class: "empty" },
          total ? `Done — ${total} card${total === 1 ? "" : "s"} reviewed.` : "No flashcards are due today."
        )
      );
      refreshOverview();
      return;
    }

    const card = queue[0];
    const answer = h("p", { class: "a", hidden: true }, card.answer);
    const grades = h("div", { class: "grades", hidden: true });

    const answerCard = async grade => {
      await api(`/api/cards/${card.id}/review`, {
        method: "POST",
        body: JSON.stringify({ grade })
      });
      queue.shift();
      if (grade === "again") queue.push(card);
      else done += 1;
      next();
    };

    for (const [grade, label] of [["again","Again"],["hard","Hard"],["good","Good"],["easy","Easy"]]) {
      grades.append(h("button", { class: "btn", onclick: () => answerCard(grade) }, label));
    }

    const reveal = h("button", { class: "btn primary", style: "margin-top:14px" }, "Show answer");
    const flip = () => {
      answer.hidden = false;
      grades.hidden = false;
      reveal.remove();
    };
    reveal.addEventListener("click", flip);

    deck.replaceChildren(
      h("p", { class: "progress" }, `${done + 1} of ${total}`),
      h("article", { class: "card" },
        h("p", { class: "from" },
          `${card.module} · `,
          h("a", { href: `#/file/${card.resource_id}` }, card.title)
        ),
        h("p", { class: "q" }, card.question),
        answer
      ),
      reveal,
      grades,
      h("p", { class: "keys" }, "Space to reveal · 1–4 to grade")
    );

    document.onkeydown = event => {
      if (["INPUT", "TEXTAREA"].includes(event.target.tagName)) return;
      if (event.key === " " && reveal.isConnected) {
        event.preventDefault();
        flip();
      } else if (!grades.hidden && "1234".includes(event.key)) {
        answerCard(["again", "hard", "good", "easy"][Number(event.key) - 1]);
      }
    };
  };

  next();
}

function renderMore(){
  const upcoming=overview.coming_up||[];
  const form=h("form",{class:"search-box",onsubmit:e=>{e.preventDefault();const q=e.target.querySelector("input").value;location.hash=`#/search?q=${encodeURIComponent(q)}`}},
    h("input",{type:"search",placeholder:"Search inside lectures and notes","aria-label":"Search"}));
  show(h("h1",{},"More"),h("p",{class:"sub"},"Search and secondary tools live here."),
    h("div",{class:"more-grid"},
      h("section",{class:"tool-card"},h("h2",{},"Search"),h("p",{},"Find a word or topic across your downloaded lecture material."),form),
      h("section",{class:"tool-card"},h("h2",{},"Moodle sync"),h("p",{},"Run the sync when you want to check for new or changed teaching material."),h("p",{class:"muted"},"python3 scripts/sync_moodle.py"))),
    h("section",{class:"section-block",style:"margin-top:30px"},h("div",{class:"section-title"},h("h2",{},"Coming up")),
      upcoming.length?h("div",{class:"list"},upcoming.map(x=>h("a",{class:"item",href:`#/file/${x.resource_id}`},
        h("div",{},h("div",{class:"item-title"},x.title),h("div",{class:"meta"},`${x.module} · ${fmt(parseDay(x.date),{day:"numeric",month:"short",year:"numeric"})}`)),
        h("span",{class:"badge due"},daysAway(x.date,overview.today))))):h("p",{class:"empty"},"No upcoming deadlines or exams found.")))
}

async function renderSearch(q){
  const hits=q.trim()?await api(`/api/search?q=${encodeURIComponent(q)}`):[];
  show(h("p",{class:"crumbs"},h("a",{href:"#/more"},"More")," / Search"),h("h1",{},q?`Results for “${q}”`:"Search"),
    h("p",{class:"sub"},hits.length?`${hits.length}${hits.length===40?"+":""} matching pages`:""),
    hits.length?hits.map(hit=>h("a",hit.kind==="pdf"?{class:"hit",href:fileUrl(hit.resource_id,hit.page),target:"_blank",rel:"noopener"}:{class:"hit",href:`#/file/${hit.resource_id}`},
      h("div",{class:"title"},hit.title),h("div",{class:"where"},`${hit.module}${hit.section?", "+hit.section:""} · page ${hit.page}`),h("div",{class:"snip"},highlighted(hit.snippet)))):h("p",{class:"empty"},"No matching pages found."))
}
async function refreshOverview(){overview=await api("/api/overview")}
async function route(){
  const hash=location.hash.slice(1)||"/",raw=hash.split("?")[0],[,page,arg]=raw.split("/");document.onkeydown=null;
  try{if(!overview)overview=await api("/api/overview");
    if(!page){renderNav("home");renderHome()}
    else if(page==="modules"){renderNav("modules");renderModules()}
    else if(page==="module"){renderNav("modules");await renderModule(arg)}
    else if(page==="file"){renderNav("");await renderFile(arg)}
    else if(page==="revise"){renderNav("revise");await renderRevise(new URLSearchParams(hash.split("?")[1]||"").get("file"))}
    else if(page==="more"){renderNav("more");renderMore()}
    else if(page==="search"){renderNav("more");await renderSearch(decodeURIComponent((hash.split("?q=")[1]||"")))}
    window.scrollTo(0,0)
  }catch(e){show(h("p",{class:"empty"},`Couldn't load this: ${e.message}`))}
}
window.addEventListener("hashchange",route);route();
</script>
