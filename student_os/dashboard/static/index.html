<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="token" content="{{TOKEN}}">
<title>Study desk</title>
<style>
:root {
  --paper: #F3F5F2;
  --sheet: #FBFCFA;
  --ink: #1E2A3A;
  --graphite: #5B6B78;
  --rule: #CBD5D1;
  --rule-soft: #E2E8E5;
  --teal: #0F7B6C;
  --teal-wash: #E1F0EC;
  --amber: #B9781A;
  --amber-wash: #F6ECDA;
  --brick: #A9433A;
  --brick-wash: #F5E3E0;
  --mark: #FBE7A8;
  --sans: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
  --serif: Charter, "Bitstream Charter", "Iowan Old Style", Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #131A20; --sheet: #182129; --ink: #E4EAE8; --graphite: #9AA8B2; --rule: #2E3B45;
    --rule-soft: #22303A; --teal: #4CC3AE; --teal-wash: #173A35; --amber: #E3A64A; --amber-wash: #3A2D17;
    --brick: #E07C70; --brick-wash: #3D2321; --mark: #5A4A14; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 3px; }

/* frame */
.frame { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
.side { border-right: 1px solid var(--rule); padding: 22px 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { font-weight: 600; font-size: 17px; letter-spacing: .01em; margin: 0 0 22px 6px; display: flex; gap: 10px; align-items: center; }
.brand svg { flex: none; }
.nav { list-style: none; margin: 0; padding: 0; }
.nav a { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline; padding: 8px 10px; border-radius: 6px; text-decoration: none; }
.nav a:hover { background: var(--rule-soft); }
.nav a[aria-current="page"] { background: var(--teal-wash); color: var(--ink); }
.nav .name { font-weight: 500; }
.nav .code { display: block; font-size: 12px; color: var(--graphite); font-variant-numeric: tabular-nums; }
.nav .count { font-size: 12px; color: var(--graphite); font-variant-numeric: tabular-nums; }
.nav .fresh { color: var(--teal); font-weight: 600; }
.nav-gap { height: 18px; }
.side-note { font-size: 12px; color: var(--graphite); margin: 26px 10px 0; }

.main { padding: 22px clamp(18px, 4vw, 48px) 60px; }
.search { display: flex; gap: 10px; align-items: center; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 0 14px; max-width: 760px; }
.search:focus-within { border-color: var(--teal); }
.search input { flex: 1; border: 0; background: transparent; font: inherit; font-size: 16px; color: var(--ink); padding: 12px 0; outline: none; }
.search svg { color: var(--graphite); flex: none; }
.view { margin-top: 30px; }
h1 { font-size: 28px; line-height: 1.2; font-weight: 600; margin: 0 0 4px; letter-spacing: -.01em; }
h2 { font-size: 17px; font-weight: 600; margin: 0 0 14px; }
.sub { color: var(--graphite); margin: 0 0 26px; }
.sub a { color: var(--teal); }
.muted { color: var(--graphite); }
.empty { color: var(--graphite); font-family: var(--serif); font-size: 16px; padding: 18px 0; max-width: 46ch; }

/* home */
.home { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(24px, 4vw, 56px); align-items: start; }

/* the scale bar: weeks as ticks on a vertical ruler */
.ruler { position: relative; padding-left: 26px; }
.ruler::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--ink); opacity: .85; }
.week { position: relative; padding-bottom: 14px; }
.week-label { position: relative; font-size: 13px; color: var(--graphite); font-variant-numeric: tabular-nums; margin: 0 0 8px; }
.week-label::before { content: ""; position: absolute; left: -26px; top: 9px; width: 16px; height: 2px; background: var(--ink); }
.week-label b { color: var(--ink); font-weight: 600; }
.pin { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start; margin: 0 0 10px; text-decoration: none; padding: 10px 12px 10px 0; border-radius: 8px; }
.pin:hover { background: var(--sheet); }
.pin .day { text-align: center; border-right: 3px solid var(--amber); padding-right: 8px; }
.pin.exam .day { border-color: var(--brick); }
.pin .day b { display: block; font-size: 24px; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; }
.pin .day span { display: block; font-size: 12px; color: var(--graphite); }
.pin .day .away { color: var(--ink); font-weight: 500; }
.pin .what { font-weight: 500; }
.pin .tag { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--amber-wash); color: var(--amber); margin-right: 6px; }
.pin.exam .tag { background: var(--brick-wash); color: var(--brick); }
.pin .where { font-size: 13px; color: var(--graphite); }
.pin .quote { font-family: var(--serif); font-size: 14px; margin-top: 3px; color: var(--ink); opacity: .85; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.away { font-size: 12px; color: var(--graphite); white-space: nowrap; }

.day-group { margin: 0 0 22px; }
.day-group h3 { font-size: 13px; font-weight: 600; color: var(--graphite); margin: 0 0 6px; }
.row { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 8px 10px; border-radius: 6px; text-decoration: none; border-bottom: 1px solid var(--rule-soft); }
.row:hover { background: var(--sheet); }
.row .title { font-weight: 500; overflow-wrap: anywhere; }
.row .where { display: block; font-size: 13px; color: var(--graphite); }
.row .where.inline { display: inline; }
.kind { font-size: 11px; font-weight: 600; text-align: center; padding: 1px 0; border-radius: 4px; background: var(--rule-soft); color: var(--graphite); }
.kind.pdf { background: var(--brick-wash); color: var(--brick); }
.kind.pptx, .kind.ppt { background: var(--amber-wash); color: var(--amber); }
.kind.docx, .kind.doc { background: var(--teal-wash); color: var(--teal); }
.badge { font-size: 12px; font-weight: 600; color: var(--teal); }
.badge.updated { color: var(--amber); }
.badge.removed { color: var(--graphite); text-decoration: line-through; }
.more { background: none; border: 0; color: var(--teal); padding: 6px 10px; cursor: pointer; font-weight: 500; }

/* module */
.section { margin: 0 0 30px; max-width: 900px; }
.section h2 { padding-bottom: 6px; border-bottom: 2px solid var(--ink); display: flex; justify-content: space-between; gap: 12px; }
.section h2 span { font-weight: 400; font-size: 13px; color: var(--graphite); }

/* file */
.crumbs { font-size: 13px; color: var(--graphite); margin: 0 0 6px; }
.crumbs a { color: var(--graphite); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 30px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--sheet); padding: 8px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; font-weight: 500; }
.btn:hover { border-color: var(--teal); }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
@media (prefers-color-scheme: dark) { .btn.primary { color: #0D1A17; } }
.file-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: clamp(24px, 4vw, 56px); align-items: start; max-width: 1100px; }
.toc { list-style: none; padding: 0; margin: 0; font-family: var(--serif); font-size: 16px; max-width: 34em; }
.toc li { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: baseline; }
.toc a, .toc span.t { padding: 5px 0; text-decoration: none; }
.toc a:hover { color: var(--teal); }
.toc li::after { content: none; }
.toc .p { font-family: var(--sans); font-size: 12px; color: var(--graphite); font-variant-numeric: tabular-nums; }
.facts { font-size: 13px; color: var(--graphite); margin: 0 0 22px; }
.date-item { padding: 10px 0; border-bottom: 1px solid var(--rule-soft); }
.date-item .when { font-weight: 600; font-variant-numeric: tabular-nums; }
.date-item .quote { font-family: var(--serif); font-size: 14px; }
.date-item.past { opacity: .55; }
.kindword { font-size: 12px; font-weight: 600; margin-left: 6px; }
.kindword.deadline { color: var(--amber); }
.kindword.exam { color: var(--brick); }

/* search */
.hit { display: block; padding: 12px 10px; border-bottom: 1px solid var(--rule-soft); text-decoration: none; max-width: 860px; border-radius: 6px; }
.hit:hover { background: var(--sheet); }
.hit .title { font-weight: 600; }
.hit .where { font-size: 13px; color: var(--graphite); }
.hit .snip { font-family: var(--serif); font-size: 15px; margin-top: 4px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

@media (max-width: 860px) {
  .frame { grid-template-columns: 1fr; }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding: 14px 16px; }
  .nav { display: flex; gap: 6px; overflow-x: auto; }
  .nav li { flex: none; }
  .nav .count, .nav-gap, .side-note { display: none; }
  .brand { margin-bottom: 10px; }
  .home, .file-grid { grid-template-columns: 1fr; }
  .main { padding: 18px 16px 48px; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div class="frame">
  <aside class="side">
    <p class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 16 C8 15 10 12 12 9 S16 5 18 5" fill="none" stroke="var(--teal)" stroke-width="2"/><path d="M5 12h12M5 8h12" stroke="currentColor" stroke-width="1" opacity=".35"/></svg>
      Study desk
    </p>
    <ul class="nav" id="nav"></ul>
    <p class="side-note">Run the sync to fetch new files. Search, outlines and dates update after each sync.</p>
  </aside>
  <main class="main">
    <form class="search" id="search-form" role="search">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="7.5" cy="7.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 12l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search inside your lectures and notes" aria-label="Search inside your lectures and notes" autocomplete="off">
    </form>
    <div class="view" id="view" aria-live="polite"></div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const TOKEN = document.querySelector('meta[name="token"]').content;
const view = document.getElementById("view");
const nav = document.getElementById("nav");
let overview = null;

const api = async (path, options = {}) => {
  const response = await fetch(path, { ...options, headers: { "X-Token": TOKEN } });
  if (!response.ok) throw new Error((await response.json()).error || response.statusText);
  return response.json();
};
const fileUrl = (id, page) => `/files/${id}?t=${encodeURIComponent(TOKEN)}${page ? `#page=${page}` : ""}`;

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value === null || value === undefined || value === false) continue;
    if (key === "class") el.className = value;
    else if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
    else el.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    el.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return el;
}
const highlighted = text => {
  const span = h("span");
  String(text).split(/(\[\[|\]\])/).reduce((inMark, part) => {
    if (part === "[[") return true;
    if (part === "]]") return false;
    if (part) span.append(inMark ? h("mark", {}, part) : document.createTextNode(part));
    return inMark;
  }, false);
  return span;
};
const show = (...children) => view.replaceChildren(...children.flat(Infinity).filter(c => c !== null && c !== undefined && c !== false));
const toast = message => {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove("show"), 2200);
};

const DAY = 86400000;
const parseDay = iso => new Date(iso + "T12:00:00");
const fmt = (date, options) => date.toLocaleDateString("en-GB", options);
function daysAway(iso, todayIso) {
  const n = Math.round((parseDay(iso) - parseDay(todayIso)) / DAY);
  return n === 0 ? "today" : n === 1 ? "tomorrow" : `in ${n} days`;
}
function weekStart(iso) {
  const d = parseDay(iso);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d.toISOString().slice(0, 10);
}
function dayLabel(stamp) {
  const d = new Date(stamp);
  const today = new Date();
  const diff = Math.round((new Date(today.toDateString()) - new Date(d.toDateString())) / DAY);
  if (diff === 0) return "Today";
  if (diff === 1) return "Yesterday";
  return fmt(d, { weekday: "long", day: "numeric", month: "long" });
}
const unitsFor = kind => kind === "pptx" ? "slides" : kind === "docx" ? "sections" : "pages";
const kindTag = kind => h("span", { class: `kind ${kind}` }, kind === "link" ? "link" : kind === "video" ? "video" : kind);

/* --- navigation ----------------------------------------------------------- */
function renderNav(current) {
  nav.replaceChildren(
    h("li", {}, h("a", { href: "#/", "aria-current": current === "home" ? "page" : null },
      h("span", { class: "name" }, "Overview"))),
    h("li", { class: "nav-gap", "aria-hidden": "true" }),
    ...(overview?.modules || []).map(m => h("li", {},
      h("a", { href: `#/module/${m.id}`, title: m.full_name, "aria-current": current === `module/${m.id}` ? "page" : null },
        h("span", {}, h("span", { class: "name" }, m.name), m.code ? h("span", { class: "code" }, m.code) : null),
        h("span", { class: `count ${m.recent ? "fresh" : ""}` }, m.recent ? `${m.recent} new` : m.files)))));
}

/* --- views ---------------------------------------------------------------- */
function renderHome() {
  const { coming_up: items, feed, today } = overview;
  const weeks = new Map();
  for (const item of items) {
    const key = weekStart(item.date);
    if (!weeks.has(key)) weeks.set(key, []);
    weeks.get(key).push(item);
  }
  const thisWeek = weekStart(today);
  const ruler = items.length
    ? h("div", { class: "ruler" }, [...weeks].map(([start, pins]) => h("div", { class: "week" },
        h("p", { class: "week-label" }, start === thisWeek ? h("b", {}, "This week") : "Week of ",
          start === thisWeek ? "" : fmt(parseDay(start), { day: "numeric", month: "long" })),
        pins.map(pin => h("a", { class: `pin ${pin.kind}`, href: `#/file/${pin.resource_id}` },
          h("div", { class: "day" }, h("b", {}, parseDay(pin.date).getDate()),
            h("span", {}, fmt(parseDay(pin.date), { weekday: "short" })),
            h("span", { class: "away" }, daysAway(pin.date, today))),
          h("div", {},
            h("div", {}, h("span", { class: "tag" }, pin.kind === "exam" ? "Exam" : "Deadline"),
              h("span", { class: "what" }, pin.title)),
            h("div", { class: "where" }, `${pin.module}, page ${pin.page}`),
            h("div", { class: "quote" }, pin.snippet)))))))
    : h("p", { class: "empty" }, "No deadlines or exams found in your files for the next four months. Dates appear here once a brief or handbook mentions them.");

  const groups = new Map();
  for (const event of feed) {
    const label = dayLabel(event.at);
    if (!groups.has(label)) groups.set(label, []);
    groups.get(label).push(event);
  }
  const feedEl = feed.length
    ? h("div", {}, [...groups].map(([label, events]) => {
        const group = h("section", { class: "day-group" }, h("h3", {}, label, h("span", { class: "muted" }, ` (${events.length})`)));
        const shown = events.slice(0, 8);
        const list = h("div", {}, shown.map(feedRow));
        group.append(list);
        if (events.length > shown.length) {
          group.append(h("button", { class: "more", onclick: e => { list.replaceChildren(...events.map(feedRow)); e.target.remove(); } },
            `Show all ${events.length}`));
        }
        return group;
      }))
    : h("p", { class: "empty" }, "Nothing new from Moodle in the last two weeks. Run the sync to check again.");

  show(
    h("h1", {}, greeting()),
    h("p", { class: "sub" }, fmt(parseDay(today), { weekday: "long", day: "numeric", month: "long" })),
    h("div", { class: "home" },
      h("section", {}, h("h2", {}, "Coming up"), ruler),
      h("section", {}, h("h2", {}, "New and updated"), feedEl)));
}
function feedRow(event) {
  return h("a", { class: "row", href: `#/file/${event.resource_id}` },
    kindTag(event.kind),
    h("span", {}, h("span", { class: "title" }, event.title),
      h("span", { class: "where" }, `${event.module}${event.section ? ", " + event.section : ""}`)),
    h("span", { class: `badge ${event.event}` }, event.event === "new" ? "New" : event.event === "updated" ? "Updated" : "Removed"));
}
function greeting() {
  const hour = new Date().getHours();
  return hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
}

async function renderModule(id) {
  const module = await api(`/api/module/${id}`);
  show(
    h("h1", {}, module.name),
    h("p", { class: "sub" }, module.code ? `${module.code}. ` : "", h("a", { href: module.url, target: "_blank", rel: "noopener" }, "Open on Moodle")),
    module.sections.length ? module.sections.map(section => h("section", { class: "section" },
      h("h2", {}, section.name, h("span", {}, `${section.items.length} ${section.items.length === 1 ? "item" : "items"}`)),
      section.items.map(item => {
        const isLink = item.kind === "link" || item.kind === "video";
        return h("a", isLink ? { class: "row", href: item.moodle_url, target: "_blank", rel: "noopener" }
                             : { class: "row", href: `#/file/${item.id}` },
          kindTag(item.kind),
          h("span", {}, h("span", { class: "title" }, item.title),
            item.pages ? h("span", { class: "where" }, `${item.pages} ${unitsFor(item.kind)}`) : null,
            isLink ? h("span", { class: "where" }, item.type === "assign" ? "Assignment on Moodle" : item.kind === "video" ? "Video on Moodle" : "On Moodle") : null),
          h("span", { class: `badge ${item.badge}` }, item.badge === "new" ? "New" : item.badge === "updated" ? "Updated" : ""));
      }))) : h("p", { class: "empty" }, "No files from this module yet. Run the sync to fetch them."));
}

async function renderFile(id) {
  const file = await api(`/api/resource/${id}`);
  const isPdf = file.kind === "pdf";
  const openFile = async page => {
    if (isPdf) { window.open(fileUrl(file.id, page), "_blank", "noopener"); return; }
    await api(`/api/open/${file.id}`, { method: "POST" });
    toast(page ? `Opened — go to ${file.kind === "pptx" ? "slide" : "page"} ${page}` : "Opened");
  };
  const unit = file.kind === "pptx" ? "Slide" : file.kind === "docx" ? "Section" : "Page";
  const outline = file.outline.length
    ? h("ol", { class: "toc" }, file.outline.map(entry => h("li", {},
        file.has_file ? h("a", { href: "#", onclick: e => { e.preventDefault(); openFile(entry.page); } }, entry.title)
                      : h("span", { class: "t" }, entry.title),
        h("span", { class: "p" }, `${unit} ${entry.page}`))))
    : h("p", { class: "empty" }, file.read_error ? `No outline: ${file.read_error}.` : "No outline for this file.");
  const dates = file.dates.length
    ? file.dates.map(d => h("div", { class: `date-item ${d.upcoming ? "" : "past"}` },
        h("div", {}, h("span", { class: "when" }, fmt(parseDay(d.date), { weekday: "short", day: "numeric", month: "short", year: "numeric" })),
          d.kind !== "date" ? h("span", { class: `kindword ${d.kind}` }, d.kind === "exam" ? "Exam" : "Deadline") : null,
          h("span", { class: "muted" }, `, ${unit.toLowerCase()} ${d.page}`)),
        h("div", { class: "quote" }, d.snippet)))
    : h("p", { class: "empty" }, "No dates mentioned in this file.");
  const facts = [file.pages ? `${file.pages} ${unit.toLowerCase()}s` : null, file.words ? `${file.words.toLocaleString("en-GB")} words` : null,
                 file.truncated ? "very long: only the first 400 pages were read" : null,
                 file.updated_at ? `last changed ${new Date(file.updated_at).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}` : null].filter(Boolean);
  show(
    h("p", { class: "crumbs" }, h("a", { href: `#/module/${file.module_id}` }, file.module), file.section ? ` / ${file.section}` : ""),
    h("h1", {}, file.title),
    h("p", { class: "facts" }, facts.join(", ")),
    h("div", { class: "actions" },
      file.has_file ? h("button", { class: "btn primary", onclick: () => openFile() }, isPdf ? "Read" : "Open") : null,
      file.has_file && isPdf ? h("button", { class: "btn", onclick: async () => { await api(`/api/open/${file.id}`, { method: "POST" }); toast("Opened in Preview"); } }, "Open in Preview") : null,
      h("a", { class: "btn", href: file.moodle_url, target: "_blank", rel: "noopener" }, "Open on Moodle")),
    h("div", { class: "file-grid" },
      h("section", {}, h("h2", {}, "Outline"), outline),
      h("section", {}, h("h2", {}, "Dates in this file"), dates,
        file.versions.length ? h("div", { style: "margin-top:26px" }, h("h2", {}, "Earlier versions"),
          file.versions.map(v => h("p", { class: "muted" }, `Replaced ${new Date(v.at).toLocaleDateString("en-GB", { day: "numeric", month: "short" })} — kept in ${v.path}`))) : null)));
}

async function renderSearch(q) {
  document.getElementById("q").value = q;
  const hits = q.trim() ? await api(`/api/search?q=${encodeURIComponent(q)}`) : [];
  show(
    h("h1", {}, q.trim() ? `Results for “${q}”` : "Search"),
    h("p", { class: "sub" }, hits.length ? `${hits.length}${hits.length === 40 ? "+" : ""} matching pages, best first` : ""),
    hits.length ? hits.map(hit => h("a", hit.kind === "pdf"
        ? { class: "hit", href: fileUrl(hit.resource_id, hit.page), target: "_blank", rel: "noopener", title: `Open at page ${hit.page}` }
        : { class: "hit", href: `#/file/${hit.resource_id}` },
      h("div", { class: "title" }, hit.title),
      h("div", { class: "where" }, `${hit.module}${hit.section ? ", " + hit.section : ""}. Page ${hit.page}${hit.page_title && hit.page_title !== hit.title ? ": " + hit.page_title : ""}`),
      h("div", { class: "snip" }, highlighted(hit.snippet))))
    : q.trim() ? h("p", { class: "empty" }, "No pages mention that. Try fewer or different words — searching “psychro” also finds psychrometry.") : null);
}

/* --- router --------------------------------------------------------------- */
async function route() {
  const hash = location.hash.slice(1) || "/";
  const [, page, arg] = hash.split("/");
  try {
    if (!overview) overview = await api("/api/overview");
    if (!page) { renderNav("home"); renderHome(); }
    else if (page === "module") { renderNav(`module/${arg}`); await renderModule(arg); }
    else if (page === "file") { renderNav(""); await renderFile(arg); }
    else if (page.startsWith("search")) { renderNav(""); await renderSearch(decodeURIComponent(hash.split("?q=")[1] || "")); }
    window.scrollTo(0, 0);
  } catch (error) {
    show(h("p", { class: "empty" }, `Couldn't load this: ${error.message}. If you restarted the dashboard, reload the page.`));
  }
}
document.getElementById("search-form").addEventListener("submit", e => {
  e.preventDefault();
  location.hash = `#/search?q=${encodeURIComponent(document.getElementById("q").value)}`;
});
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
